name: nhatro-441

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nhatro-441:local
    init: true
    restart: unless-stopped
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-9000}:8000"
    environment:
      APP_NAME: "${PROPERTY_NAME:-Nhà trọ 441 BPL}"
      APP_ENV: local
      APP_KEY: "${DOCKER_APP_KEY:-}"
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://127.0.0.1:9000}"
      APP_LOCALE: vi
      APP_FALLBACK_LOCALE: vi
      APP_FAKER_LOCALE: vi_VN
      APP_TIMEZONE: "${APP_TIMEZONE:-Asia/Ho_Chi_Minh}"
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      DB_FOREIGN_KEYS: "true"
      DB_BUSY_TIMEOUT: "5000"
      DB_JOURNAL_MODE: WAL
      DB_SYNCHRONOUS: NORMAL
      DB_BACKUP_PATH: /data/backups
      DB_BACKUP_RETENTION: "${DB_BACKUP_RETENTION:-30}"
      SESSION_DRIVER: database
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "false"
      SESSION_SAME_SITE: lax
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      ADMIN_NAME: "${ADMIN_NAME:-Quản trị viên}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env before starting Docker}"
      PROPERTY_CODE: "${PROPERTY_CODE:-441}"
      PROPERTY_NAME: "${PROPERTY_NAME:-Nhà trọ 441 BPL}"
      PROPERTY_ADDRESS: "${PROPERTY_ADDRESS:-}"
    volumes:
      - app-data:/data
      - app-storage:/var/www/html/storage
      - ./database:/var/www/html/database

  frontend:
    image: node:22-alpine
    profiles: ["dev"]
    working_dir: /var/www/html
    init: true
    ports:
      - "${VITE_PORT:-5173}:5173"
    command: >
      sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/var/www/html
      - frontend-node-modules:/var/www/html/node_modules

volumes:
  app-data:
  app-storage:
  frontend-node-modules:
